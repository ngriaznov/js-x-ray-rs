# Upstream reference: https://github.com/NodeSecure/js-x-ray (workspaces/js-x-ray)
[package]
name = "js-x-ray-rs"
description = "Static security analysis of JavaScript/TypeScript: detect malicious code, obfuscation and supply-chain patterns in untrusted JS. Rust port of @nodesecure/js-x-ray, powered by oxc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["security", "javascript", "static-analysis", "malware", "sast"]
categories = ["development-tools", "parser-implementations", "wasm"]

[features]
default = ["fs"]
# Filesystem-backed APIs (analyse_file, EntryFilesAnalyser). Disable for WASM.
fs = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
regex.workspace = true
serde_stacker.workspace = true
stacker.workspace = true
regex-syntax.workspace = true
thiserror.workspace = true
indexmap.workspace = true
url.workspace = true
